# Publie l'application sur GitHub Pages à chaque modification de main.
#
# Prérequis, à faire une seule fois à la main : Settings → Pages →
# Source → « GitHub Actions ». GitHub interdit à un workflow de créer
# lui-même le site Pages (« Resource not accessible by integration »),
# cette activation ne peut donc pas être automatisée.
#
# Une fois faite, plus rien n'est manuel : toute modification poussée
# sur main se retrouve en ligne toute seule.

name: Publier l'application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Préparer le contenu
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
