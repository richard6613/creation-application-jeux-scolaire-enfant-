<script>
  // Met l'application en réserve sur l'appareil, pour pouvoir jouer sans
  // connexion. Sans effet quand la page est ouverte directement depuis un
  // fichier local : le navigateur l'interdit, et l'application n'en a pas
  // besoin dans ce cas puisque tout est déjà sur place.
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        // La réserve répond avant le réseau, donc une nouvelle version
        // ne s'affiche qu'au chargement suivant. Sans prévenir, on croit
        // que rien n'a changé. On propose donc de recharger dès qu'une
        // version est prête.
        function surveiller(sw) {
          if (!sw) return;
          sw.addEventListener('statechange', function () {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              annoncerVersion();
            }
          });
        }
        surveiller(reg.installing);
        reg.addEventListener('updatefound', function () { surveiller(reg.installing); });

        // Une version peut déjà attendre depuis le lancement précédent,
        // sans que rien ne l'ait annoncé.
        if (reg.waiting && navigator.serviceWorker.controller) annoncerVersion();

        // On vérifie de nous-mêmes, sans attendre.
        setTimeout(function () { reg.update().catch(function () {}); }, 1500);

        /* Et on recommence à chaque retour au premier plan. Se promener
           dans l'application ne recharge pas la page : sans cela, une
           application installée sur l'écran d'accueil peut rester des
           jours en mémoire sans jamais rien vérifier. */
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) reg.update().catch(function () {});
        });
        window.addEventListener('focus', function () {
          reg.update().catch(function () {});
        });

        // De loin en loin, si elle reste ouverte longtemps.
        setInterval(function () { reg.update().catch(function () {}); }, 20 * 60 * 1000);
      }).catch(function () {
        /* sans réserve, l'application fonctionne quand même, il faut juste du réseau */
      });
    });
  }

  function annoncerVersion() {
    if (document.getElementById('bandeau-version')) return;
    var b = document.createElement('div');
    b.id = 'bandeau-version';
    b.className = 'bandeau-version';
    b.setAttribute('role', 'status');
    b.innerHTML = '<span>Une nouvelle version est prête.</span>';
    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'btn btn-principal';
    bouton.textContent = 'Mettre à jour';
    bouton.addEventListener('click', function () { location.reload(); });
    b.appendChild(bouton);
    document.body.appendChild(b);
  }
</script>
